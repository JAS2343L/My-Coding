<!DOCTYPE html>
<html>
    <head>
        <title>
            THE FORM
        </title>
        <style>
            h1{
                display: grid;
                justify-content: center;
            }
            form {
                display: grid;
                justify-content: center;
            }
            input {
                background-color: rgb(84, 81, 81);
                color:white;
                border: 1px solid red;
                border-radius:7px
            }
        </style>
    </head>
    <body>
        <h1><font font-style="Arial" color="red"> THE FORM</font></h1>
        <form>
            Enter Your Name <input type ="text" name="name"><br><br>
            Enter Your Age <input type="number" name="age"><br><br>
            Enter Your Email <input type="email" name="email"><br><br>
            Enter Your Phone-Number <input type="tel" name="phone" maxlength="10"><br><br>
        </form>
    </body>
</html>
